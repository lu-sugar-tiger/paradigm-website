<main class="page">
{{PAGE_HEADLINE}}

  <section class="product-detail">
    <div class="container">
      <div class="product-detail__panel" data-product-detail data-product-number="{{PRODUCT_NUMBER}}" data-notification-title="{{TITLE}}">
        <div class="product-detail__gallery" data-product-gallery aria-label="{{TITLE}} images">
{{PRODUCT_MEDIA}}
        </div>
        <article class="product-detail__summary">
          <div class="product-detail__header">
            <div>
              <p class="product-detail__label" data-product-category>{{CATEGORY}}</p>
              <h1 data-product-title>{{TITLE}}</h1>
            </div>
            {{PRICE}}
          </div>

          <div class="stack-md">
{{COLOR_CHOICES}}
{{SIZE_CHOICES}}
          </div>

{{PRIMARY_ACTION}}

{{DESCRIPTION}}
        </article>
      </div>
    </div>
  </section>

  <section class="section section--tight product-feed-section">
    <div class="container">
{{RELATED_PRODUCTS}}
    </div>
  </section>
</main>
