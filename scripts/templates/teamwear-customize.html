<main class="page">
{{PAGE_HEADLINE}}

  <section class="product-detail">
    <div class="container">
      <div class="product-detail__panel">
        <div class="product-detail__gallery" data-builder-preview data-media-zoom-gallery aria-label="{{MODEL_NAME}} images">
          <img src="../../assets/images/teamwear/teamwear-court-action.webp" alt="Basketball team wearing Paradigm Teamwear during a night game" width="1800" height="1800" data-media-zoom-touch>
          <img src="../../assets/images/teamwear/teamwear-court-road.webp" alt="Player wearing the Road side of Paradigm {{MODEL_NAME}}" width="1100" height="1100" loading="lazy" data-media-zoom-touch>
          <img src="../../assets/images/teamwear/teamwear-court-home.webp" alt="Players wearing the Home side of Paradigm {{MODEL_NAME}}" width="1100" height="1100" loading="lazy" data-media-zoom-touch>
        </div>

        <article class="product-detail__summary" data-teamwear-form data-teamwear-model="{{MODEL_CODE}}" data-notification-title="{{MODEL_NAME}}">
          <div class="product-detail__header">
            <div><h1 id="builder-title">{{MODEL_NAME}}</h1></div>
            {{PRICE}}
          </div>

          <div class="stack-md">
{{COLOR_CHOICES}}
{{PATTERN_CHOICES}}
{{QUANTITY_CHOICES}}
{{ADD_ON_CHOICES}}
          </div>

{{PRIMARY_ACTION}}

{{DESCRIPTION}}
        </article>
      </div>
    </div>
  </section>
</main>
